<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- body text: shown at once in a fallback font while it loads -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,700;1,700&display=swap">
  <!-- script capitals + serif titles: never drawn in a fallback font (it sits at a different height,
       e.g. the A of "Anh" jumped up), the text waits a moment for the real font instead -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Rouge+Script&family=Cormorant+Garamond:wght@400&family=Pinyon+Script&display=block">
  <script src="js/fit.js"></script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/home.css">
  <noscript><style>.intro { display: none; } .is-intro #site-header, .is-intro #app { opacity: 1; }</style></noscript>
</head>
<body class="page-home is-intro">
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro__scene">
      <div class="intro__thought">
        <img src="assets/illustrations/05-sparkle-cam.png" alt="">
        <img src="assets/illustrations/03-chat-bubble-cam.png" alt="">
        <img src="assets/illustrations/01-chom-sao-y-tuong.png" alt="">
        <img src="assets/illustrations/06-bang-mau-hoa-si.png" alt="">
      </div>
      <img class="intro__girl" src="assets/illustrations/01-co-gai-cam-ipad.png" alt="">
    </div>
  </div>
  <header id="site-header"></header>
  <main id="app"></main>
  <noscript><p class="noscript">Trang này cần bật JavaScript để hiển thị nội dung. Hãy bật JavaScript trong trình duyệt rồi tải lại trang.</p></noscript>
  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
